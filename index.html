<section class="contenedor formulario-busqueda">
    <h2>Buscar palabra</h2>

    <p>
        Escribe una palabra en español para consultar su traducción en lengua materna.
    </p>

    <form id="formularioBusqueda">
        <label for="palabraInput">Palabra en español:</label>

        <input 
            type="text" 
            id="palabraInput" 
            name="palabra" 
            placeholder="Ejemplo: agua, casa, sol" 
            required
        >

        <button type="submit" id="btnBuscar">
            Buscar traducción
        </button>
    </form>

    <div id="resultadoTraduccion">
        <!-- Aquí se mostrará la traducción más adelante con JavaScript -->
    </div>
</section>

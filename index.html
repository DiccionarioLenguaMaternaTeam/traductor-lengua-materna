<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto Diccionario - Página Básica</title>
  </head>
  <body>
    <main>
      <h1>Diccionario Español - Lengua Materna</h1>

      <!-- Campo de entrada para la palabra a buscar -->
      <label for="palabra">Escribe una palabra en español:</label>
      <input id="palabra" type="text" placeholder="ej. casa" />
      <button id="btnBuscar">Buscar</button>

      <!-- Contenedor donde se mostrará el resultado de la búsqueda -->
      <section id="resultado" aria-live="polite"></section>
    </main>

    <!-- Conectar script externo -->
    <script src="script.js"></script>
  </body>
</html>

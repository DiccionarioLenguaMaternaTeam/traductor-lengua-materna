<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diccionario Español - Lengua Materna</title>
    <style>
      /* CSS básico para estructura visual simple */
      body { font-family: Arial, sans-serif; margin: 24px; background:#f7f7f7; }
      main { max-width:720px; margin:0 auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
      h1 { margin-top:0; }
      .fila { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
      input[type="text"] { flex:1; padding:8px 10px; font-size:16px; }
      button { padding:8px 12px; font-size:16px; cursor:pointer; }
      #resultado { margin-top:16px; min-height:48px; }
      .card { background:#fafafa; border:1px solid #e5e5e5; padding:12px; border-radius:6px; }
      .notfound { color:#a00; }
      .label { font-weight:600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Diccionario Español - Lengua Materna</h1>

      <!-- Interfaz de búsqueda: input + botón -->
      <div class="fila">
        <label for="palabra" class="sr-only">Palabra en español</label>
        <input id="palabra" type="text" placeholder="Escribe una palabra en español (ej. casa)" aria-label="Palabra en español">
        <button id="btnBuscar">Buscar</button>
      </div>

      <!-- Área donde se mostrarán los resultados -->
      <div id="resultado" aria-live="polite"></div>
    </main>

    <!-- Conectar script externo -->
    <script src="script.js"></script>
  </body>
</html>
  </head>
  <body>
    <h1>Proyecto Diccionario</h1>
    <p>Esta es una página HTML muy básica añadida al repositorio.</p>
  </body>
</html>
